name: "Build (Clang) - reusable"

on:
  workflow_call:
    inputs:
      os:
        description: "Runner label"
        required: false
        type: string
        default: "ubuntu-latest"
      build-args:
        description: "Additional build script arguments"
        required: false
        type: string
        default: ""
    secrets:
      PRAGMA_TESTS_IMPORT_TOKEN:
        required: true
    outputs:
      install-dir:
        description: "Path to installed runtime"
        value: ${{ jobs.build.outputs.install-dir }}
      build-dir:
        description: "Path to build directory"
        value: ${{ jobs.build.outputs.build-dir }}
      deps-dir:
        description: "Path to deps directory"
        value: ${{ jobs.build.outputs.deps-dir }}

env:
  # See https://github.com/git-lfs/git-lfs/issues/5749
  GIT_CLONE_PROTECTION_ACTIVE: 'false'

jobs:
  build:
    name: Build - ${{ inputs.os }}
    runs-on: ${{ inputs.os }}
    # expose the step outputs as job outputs so callers can access them
    outputs:
      install-dir: ${{ steps.build-pragma.outputs.install-dir }}
      build-dir: ${{ steps.build-pragma.outputs.build-dir }}
      deps-dir: ${{ steps.build-pragma.outputs.deps-dir }}

    # no matrix here — the caller selects the OS via the `os` input
    steps:
      # Make sure workspace is cleaned up (this is mostly needed for self-hosted runners, which don't clean up automatically)
      - name: Initial Cleanup
        if: ${{ always() }}
        shell: bash
        run: |
          rm -rf "${{ github.workspace }}"/*
          sudo pacman -Syu --noconfirm python-pip

      - name: Setup Pragma
        uses: Silverlan/tmp_pragma/github_actions/setup@main
        with:
          branch: ${{ github.ref_name }}
          clone_url: "https://github.com/${{ github.repository }}.git"

      # We need the latest Windows SDK
      - uses: GuillaumeFalourd/setup-windows10-sdk-action@v2.4
        if: runner.os == 'Windows'
        with:
          sdk-version: 22621

      - name: Build Pragma
        uses: ./pragma/github_actions/build
        id: build-pragma
        with:
          build-args: '--with-pfm --with-all-pfm-modules --with-vr --with-networking --with-lua-debugger=0 --with-swiftshader ${{ inputs.build-args }}'

      - name: Run Tests
        uses: ./pragma/github_actions/run_common_tests
        timeout-minutes: 60
        with:
          working-directory: "${{ steps.build-pragma.outputs.install-dir }}"
          import-tests-token: "${{ secrets.PRAGMA_TESTS_IMPORT_TOKEN }}"

      - name: Analyze Disk Space
        if: failure()
        uses: Silverlan/common_actions/analyze_disk_space@main

      - name: Upload Debug Artifacts
        if: ${{ !cancelled() }}
        uses: ./pragma/github_actions/upload_debug_artifacts
        with:
          build-dir: '${{ steps.build-pragma.outputs.build-dir }}'
          deps-dir: '${{ steps.build-pragma.outputs.deps-dir }}'
          install-dir: '${{ steps.build-pragma.outputs.install-dir }}'

      - name: Upload install artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pragma-${{ inputs.os }}
          path: ${{ steps.build-pragma.outputs.install-dir }}
          retention-days: 3

      - name: Collect PDB files
        uses: ./pragma/github_actions/collect_pdb_files
        if: ${{ runner.os == 'Windows' && !cancelled() }}
        with:
          source-directory: "${{ steps.build-pragma.outputs.build-dir }}"
          target-directory: "${{ github.workspace }}/pdb"

      - name: Upload PDB Artifacts
        uses: actions/upload-artifact@v4
        if: ${{ runner.os == 'Windows' && !cancelled() }}
        with:
          name: debug-pdb
          path: "${{ github.workspace }}/pdb"
          retention-days: 1

      # Make sure workspace is cleaned up (this is mostly needed for self-hosted runners, which don't clean up automatically)
      #- name: Final Cleanup
      #  if: ${{ always() }}
      #  shell: bash
      #  run: |
      #    rm -rf "${{ github.workspace }}"/*
