name: "[Ubuntu] Build (Clang)"
on:
  push:
    branches: [ main ]

#on:
#  push:
#    branches-ignore:
#      - main

concurrency:
  group: check-build-lin-clang-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call-build:
    uses: ./.github/workflows/build-reusable.yml
    with:
      os: ubuntu-latest
      branch: main
    secrets:
      PRAGMA_TESTS_IMPORT_TOKEN: ${{ secrets.PRAGMA_TESTS_IMPORT_TOKEN }}
