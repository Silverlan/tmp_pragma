name: "Build"

jobs:
  call-build-ubuntu:
    concurrency:
      group: check-build-ubuntu-${{ github.ref }}
      cancel-in-progress: true

    uses: ./.github/workflows/build-reusable.yml
    with:
      os: ubuntu-latest
    secrets:
      PRAGMA_TESTS_IMPORT_TOKEN: ${{ secrets.PRAGMA_TESTS_IMPORT_TOKEN }}

  call-build-windows:
    concurrency:
      group: check-build-windows-${{ github.ref }}
      cancel-in-progress: true

    uses: ./.github/workflows/build-reusable.yml
    with:
      os: windows-latest
    secrets:
      PRAGMA_TESTS_IMPORT_TOKEN: ${{ secrets.PRAGMA_TESTS_IMPORT_TOKEN }}
